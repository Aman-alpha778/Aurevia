<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurevia | Hotel Booking</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/main.js}"></script>
</head>
<body class="page-body">
<header class="topbar">
    <a class="brand" th:href="@{/portal}"><i class="fa-solid fa-hotel"></i> Aurevia Hotels</a>
    <nav>
        <a th:href="@{/portal}">Cities</a>
        <a th:href="@{/cities/chandigarh}">Chandigarh</a>
        <a th:if="${currentUser.admin}" th:href="@{/admin}">Admin</a>
    </nav>
    <div class="topbar-right">
        <div id="theme-toggle" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </div>
        <span th:text="'Hi, ' + ${currentUser.fullName}"></span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost-btn" type="submit">Logout</button>
        </form>
    </div>
</header>

<main>
    <section class="hero-banner small">
        <div>
            <p class="eyebrow">Stay Planner</p>
            <h1>Search hotels city by city and complete a booking flow.</h1>
            <p>The older flight area has been converted into hotel discovery and booking.</p>
        </div>
    </section>

    <section class="section dual-grid planner-search-section">
        <div class="panel">
            <div class="section-head left">
                <h2>Search Hotels</h2>
            </div>
            <form class="stack-form" id="hotel-search-form" th:action="@{/planner/hotels}" th:object="${searchForm}" method="get">
                <label>City</label>
                <input type="text" th:field="*{city}" placeholder="Enter city name">

                <label>Check-in date</label>
                <input type="date" th:field="*{checkIn}">

                <label>Guests</label>
                <input type="number" min="1" max="9" th:field="*{guests}">

                <button type="submit">Search hotels</button>
            </form>
        </div>
    </section>


</main>
<script>
    document.getElementById("hotel-search-form")?.addEventListener("submit", function (event) {
        event.preventDefault();
        const city = document.getElementById("city")?.value.trim();
        if (!city) {
            return;
        }
        window.open("https://www.google.com/travel/hotels/" + encodeURIComponent(city), "_blank");
    });
</script>
</body>
</html>
