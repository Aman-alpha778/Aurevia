<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurevia | Flight Planner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/main.js}"></script>
</head>
<body class="page-body">
<header class="topbar">
    <a class="brand" th:href="@{/portal}"><i class="fa-solid fa-plane-departure"></i> Aurevia Flights</a>
    <nav>
        <a th:href="@{/portal}">Cities</a>
        <a th:href="@{/planner/hotels(city=${searchForm.toCity})}">Hotels</a>
        <a th:if="${currentUser.admin}" th:href="@{/admin}">Admin</a>
    </nav>
    <div class="topbar-right">
        <div id="theme-toggle" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </div>
        <span th:text="'Hi, ' + ${currentUser.fullName}"></span>
        <form th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="ghost-btn" type="submit">Logout</button>
        </form>
    </div>
</header>

<main>
    <section class="hero-banner small">
        <div>
            <p class="eyebrow">Flight Planner</p>
            <h1 th:text="'Flights for ' + ${searchForm.toCity}">Flights for your city</h1>
            <p>Search available routes using the existing Aurevia flight options.</p>
        </div>
    </section>

    <section class="section dual-grid planner-search-section">
        <div class="panel">
            <div class="section-head left">
                <h2>Search Flights</h2>
            </div>
            <form class="stack-form" id="flight-search-form" th:action="@{/planner/flights}" th:object="${searchForm}" method="get">
                <label>From city</label>
                <input type="text" th:field="*{fromCity}" placeholder="Enter departure city">

                <label>To city</label>
                <input type="text" th:field="*{toCity}" placeholder="Enter arrival city">

                <label>Depart date</label>
                <input type="date" th:field="*{departDate}">

                <label>Travellers</label>
                <input type="number" min="1" max="9" th:field="*{travellers}">

                <button type="submit">Search flights</button>
            </form>
        </div>


    </section>


</main>
<script>
    document.getElementById("flight-search-form")?.addEventListener("submit", function (event) {
        event.preventDefault();
        const fromCity = document.getElementById("fromCity")?.value.trim();
        const toCity = document.getElementById("toCity")?.value.trim();
        const query = new URLSearchParams();
        if (fromCity) {
            query.set("from", fromCity);
        }
        if (toCity) {
            query.set("to", toCity);
        }
        const suffix = query.toString() ? "?" + query.toString() : "";
        window.open("https://www.google.com/travel/flights" + suffix, "_blank");
    });
</script>
</body>
</html>
