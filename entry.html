<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .hero {
            height: 100vh; width: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://t3.ftcdn.net/jpg/04/53/31/70/360_F_453317039_vgYyunvq6lALcAzte0pkE5Hz5gRGsPJr.jpg');
            background-size: cover;
            background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
            /* Zoom Animation */
            animation: zoomEffect 20s infinite alternate;
        }

        @keyframes zoomEffect {
            0% { background-size: 100% 100%; }
            100% { background-size: 115% 115%; }
        }

        .hero p {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 6px; font-size: 30px; text-transform: uppercase;
            margin-bottom: 10px; opacity: 0.9;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 100px; font-style: italic;
            text-shadow: 2px 4px 15px rgba(0,0,0,0.5);
        }

        /* Arrow with Glow */
        .arrow-container {
            position: absolute; bottom: 30px; cursor: pointer;
            padding: 15px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.1); /* Glassy background */
            backdrop-filter: blur(5px);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
        }

        .arrow-container i { font-size: 24px; color: white; }
    </style>
</head>
<body>

    <div class="hero">
        <p>Welcome to</p>
        <h1>Aurevia</h1>
        
        <div class="arrow-container" onclick="window.location.href='login.html'">
            <i class="fas fa-chevron-down"></i>
        </div>
    </div>

</body>
</html>
